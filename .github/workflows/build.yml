name: Build Nusuk APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Code and Build
        run: |
          curl -sL "https://gist.githubusercontent.com/script-host/raw/nusuk_generator.sh" -o build_project.sh || true
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/osamaalrwishan-sys/nusuk-app/main/setup.sh 2>/dev/null || echo 'echo ok')"
          
