name: Build Nusuk APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Download Engine and Build
        run: |
          curl -sL "https://gist.githubusercontent.com/osamaalrwishan-sys/raw/build_engine.sh" -o run.sh 2>/dev/null || true
          cat << 'ENDSCRIPT' > run.sh
          mkdir -p app/src/main/java/com/alrwishan/masarnusuk app/src/main/res/drawable app/src/main/res/values
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "nusuk-app"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alrwishan.masarnusuk'
              compileSdk 34
              defaultConfig { applicationId "com.alrwishan.masarnusuk"; minSdk 24; targetSdk 34; versionCode 20; versionName "4.2" }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="مسار نسك" android:hardwareAccelerated="true" android:theme="@android:style/Theme.NoTitleBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/alrwishan/masarnusuk/MainActivity.java
          package com.alrwishan.masarnusuk;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.*;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean isDesktop = true;
              private final String DESKTOP = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";
              private final String MOBILE = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  RelativeLayout root = new RelativeLayout(this);
                  root.setBackgroundColor(Color.parseColor("#12171F"));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setId(View.generateViewId());
                  bar.setPadding(20, 10, 20, 10);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  GradientDrawable barBg = new GradientDrawable();
                  barBg.setColor(Color.parseColor("#E6221A15"));
                  barBg.setCornerRadius(25);
                  barBg.setStroke(2, Color.parseColor("#9E7D47"));
                  bar.setBackground(barBg);
                  RelativeLayout.LayoutParams bp = new RelativeLayout.LayoutParams(-1, -2);
                  bp.setMargins(20, 15, 20, 10);
                  bar.setLayoutParams(bp);

                  Button btnD = makeBtn("💻 كمبيوتر");
                  Button btnR = makeBtn("⚡ تحديث");
                  bar.addView(btnD);
                  bar.addView(btnR);

                  webView = new WebView(this);
                  RelativeLayout.LayoutParams wp = new RelativeLayout.LayoutParams(-1, -1);
                  wp.addRule(RelativeLayout.BELOW, bar.getId());
                  webView.setLayoutParams(wp);

                  root.addView(webView);
                  root.addView(bar);
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  btnD.setOnClickListener(v -> {
                      isDesktop = !isDesktop;
                      btnD.setText(isDesktop ? "💻 كمبيوتر" : "📱 جوال");
                      s.setUserAgentString(isDesktop ? DESKTOP : MOBILE);
                      webView.reload();
                  });
                  btnR.setOnClickListener(v -> { CookieManager.getInstance().flush(); webView.reload(); });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          super.onPageFinished(v, u);
                          CookieManager.getInstance().flush();
                          String js = "setInterval(function(){" +
                                      "try{window.dispatchEvent(new MouseEvent('mousemove',{bubbles:true}));" +
                                      "if(window.fetch)fetch(window.location.href,{method:'HEAD'}).catch(function(){});}catch(e){}" +
                                      "document.querySelectorAll('input,select').forEach(function(el){" +
                                      "if(el.getAttribute('data-usr'))return;" +
                                      "el.addEventListener('input',function(){this.setAttribute('data-usr','1');});" +
                                      "var lbl=(el.closest('div')||{}).innerText||'';" +
                                      "if(lbl.indexOf('نوع الجواز')!==-1&&!el.value){el.value='عادي';el.dispatchEvent(new Event('change',{bubbles:true}));}" +
                                      "if(lbl.indexOf('البريد')!==-1&&!el.value){el.value='osamaalrwishan@gmail.com';el.dispatchEvent(new Event('change',{bubbles:true}));}" +
                                      "if(lbl.indexOf('الجوال')!==-1&&!el.value){el.value='775001721';el.dispatchEvent(new Event('change',{bubbles:true}));}" +
                                      "if(el.value==='966'||el.value==='+966'){el.value='967';el.dispatchEvent(new Event('change',{bubbles:true}));}" +
                                      "});},1500);";
                          webView.evaluateJavascript(js, null);
                      }
                  });

                  s.setUserAgentString(DESKTOP);
                  webView.loadUrl("https://masar.nusuk.sa");
              }

              private Button makeBtn(String t) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setTextColor(Color.WHITE);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.parseColor("#382A1B"));
                  g.setCornerRadius(18);
                  g.setStroke(2, Color.parseColor("#9E7D47"));
                  b.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 110, 1f);
                  lp.setMargins(8, 0, 8, 0);
                  b.setLayoutParams(lp);
                  return b;
              }
          }
          EOF
          ENDSCRIPT
          bash run.sh
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-App-Official
          path: app/build/outputs/apk/debug/*.apk
          
