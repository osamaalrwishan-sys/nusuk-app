name: Build Nusuk APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/alrwishan/masarnusuk
          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="مسار نسك"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/alrwishan/masarnusuk/MainActivity.java
          package com.alrwishan.masarnusuk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36");

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          String js = "(function() {" +
                              "setInterval(function() {" +
                              "  document.querySelectorAll('input').forEach(function(input) {" +
                              "    var ph = input.getAttribute('placeholder') || '';" +
                              "    var aria = input.getAttribute('aria-label') || '';" +
                              "    if (ph.indexOf('البريد') !== -1 || aria.indexOf('البريد') !== -1) {" +
                              "      if (input.value !== 'osamaalrwishan@gmail.com') {" +
                              "        input.value = 'osamaalrwishan@gmail.com';" +
                              "        input.dispatchEvent(new Event('input', {bubbles: true}));" +
                              "        input.dispatchEvent(new Event('change', {bubbles: true}));" +
                              "      }" +
                              "    }" +
                              "    if (ph.indexOf('الجوال') !== -1 || ph.indexOf('الهاتف') !== -1 || aria.indexOf('الجوال') !== -1) {" +
                              "      if (input.value !== '775001721') {" +
                              "        input.value = '775001721';" +
                              "        input.dispatchEvent(new Event('input', {bubbles: true}));" +
                              "        input.dispatchEvent(new Event('change', {bubbles: true}));" +
                              "      }" +
                              "    }" +
                              "    if (input.value === '966' || input.value === '+966') {" +
                              "      input.value = '967';" +
                              "      input.dispatchEvent(new Event('input', {bubbles: true}));" +
                              "      input.dispatchEvent(new Event('change', {bubbles: true}));" +
                              "    }" +
                              "  });" +
                              "}, 1500);" +
                              "})();";
                          webView.evaluateJavascript(js, null);
                      }
                  });

                  webView.loadUrl("https://masar.nusuk.sa");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.alrwishan.masarnusuk'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alrwishan.masarnusuk"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "nusuk-app"
          include ':app'
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-App-Release
          path: app/build/outputs/apk/debug/*.apk
          
