name: Build Nusuk APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Generate Code and Build
        run: |
          cat << 'ENDSCRIPT' > run.sh
          mkdir -p app/src/main/java/com/alrwishan/masarnusuk app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "nusuk-app"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.alrwishan.masarnusuk'
              compileSdk 34
              defaultConfig { applicationId "com.alrwishan.masarnusuk"; minSdk 24; targetSdk 34; versionCode 22; versionName "4.4" }
              buildTypes { release { minifyEnabled false } }
          }
          EOF

          # أيقونة نسك الذهبية الملكية
          cat << 'EOF' > app/src/main/res/drawable/ic_nusuk.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1B140E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#876B41" android:pathData="M54,16L24,34L54,52L84,34Z"/>
              <path android:fillColor="#F4E8D1" android:pathData="M54,26L36,37L54,48L72,37Z"/>
              <path android:fillColor="#D8BE8A" android:pathData="M24,38L54,56L54,88L24,70Z"/>
              <path android:fillColor="#BFA067" android:pathData="M54,56L84,38L84,70L54,88Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_nusuk"/>
              <foreground android:drawable="@drawable/ic_nusuk"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:label="مسار نسك"
                  android:icon="@drawable/ic_nusuk"
                  android:roundIcon="@drawable/ic_nusuk"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/alrwishan/masarnusuk/MainActivity.java
          package com.alrwishan.masarnusuk;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.*;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean isDesktop = true;
              private Button btnToggle;

              private final String DESKTOP = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";
              private final String MOBILE = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  RelativeLayout root = new RelativeLayout(this);
                  GradientDrawable mainBg = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.parseColor("#1B140E"), Color.parseColor("#12171F")});
                  root.setBackground(mainBg);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setId(View.generateViewId());
                  bar.setPadding(20, 12, 20, 12);
                  bar.setGravity(Gravity.CENTER_VERTICAL);

                  GradientDrawable barBg = new GradientDrawable();
                  barBg.setColor(Color.parseColor("#EB261D16"));
                  barBg.setCornerRadius(24);
                  barBg.setStroke(2, Color.parseColor("#9E7D47"));
                  bar.setBackground(barBg);
                  bar.setElevation(18);

                  RelativeLayout.LayoutParams bp = new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  bp.setMargins(20, 18, 20, 12);
                  bar.setLayoutParams(bp);

                  btnToggle = makeBtn("💻 وضع الكمبيوتر: مفعّل");
                  Button btnRefresh = makeBtn("⚡ تحديث الصفحة");
                  bar.addView(btnToggle);
                  bar.addView(btnRefresh);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#181410"));
                  RelativeLayout.LayoutParams wp = new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  wp.addRule(RelativeLayout.BELOW, bar.getId());
                  webView.setLayoutParams(wp);

                  root.addView(webView);
                  root.addView(bar);
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  applyDisplayMode();

                  btnToggle.setOnClickListener(v -> {
                      isDesktop = !isDesktop;
                      btnToggle.setText(isDesktop ? "💻 وضع الكمبيوتر: مفعّل" : "📱 وضع الجوال");
                      applyDisplayMode();
                      webView.reload();
                  });

                  btnRefresh.setOnClickListener(v -> {
                      CookieManager.getInstance().flush();
                      webView.reload();
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          super.onPageFinished(v, u);
                          CookieManager.getInstance().flush();

                          if (isDesktop) {
                              String forceDesktopMeta = 
                                  "var meta = document.querySelector('meta[name=viewport]');" +
                                  "if(meta){ meta.setAttribute('content', 'width=1280, initial-scale=0.75, maximum-scale=3.0, user-scalable=yes'); }" +
                                  "else { meta = document.createElement('meta'); meta.name='viewport'; meta.content='width=1280, initial-scale=0.75, maximum-scale=3.0, user-scalable=yes'; document.head.appendChild(meta); }" +
                                  "document.body.style.minWidth = '1280px';";
                              webView.evaluateJavascript(forceDesktopMeta, null);
                          }

                          String automationScript = 
                              "(function(){" +
                              "  setInterval(function(){" +
                              "    try{" +
                              "      window.dispatchEvent(new MouseEvent('mousemove',{bubbles:true, clientX:150, clientY:150}));" +
                              "      if(window.fetch) fetch(window.location.href, {method:'HEAD'}).catch(function(){});" +
                              "    }catch(e){}" +
                              "    document.querySelectorAll('input, select').forEach(function(el){" +
                              "      if(el.getAttribute('data-usr')) return;" +
                              "      el.addEventListener('input', function(){ this.setAttribute('data-usr','1'); });" +
                              "      var lbl = (el.closest('div')||{}).innerText || '';" +
                              "      if(lbl.indexOf('نوع الجواز') !== -1 && !el.value){" +
                              "        el.value = 'عادي'; el.dispatchEvent(new Event('change',{bubbles:true}));" +
                              "      }" +
                              "      if(lbl.indexOf('البريد') !== -1 && !el.value){" +
                              "        el.value = 'osamaalrwishan@gmail.com'; el.dispatchEvent(new Event('change',{bubbles:true}));" +
                              "      }" +
                              "      if(lbl.indexOf('الجوال') !== -1 && !el.value){" +
                              "        el.value = '775001721'; el.dispatchEvent(new Event('change',{bubbles:true}));" +
                              "      }" +
                              "      if(el.value === '966' || el.value === '+966'){" +
                              "        el.value = '967'; el.dispatchEvent(new Event('change',{bubbles:true}));" +
                              "      }" +
                              "    });" +
                              "  }, 1500);" +
                              "})();";
                          webView.evaluateJavascript(automationScript, null);
                      }
                  });

                  webView.loadUrl("https://masar.nusuk.sa");
              }

              private void applyDisplayMode() {
                  WebSettings s = webView.getSettings();
                  if (isDesktop) {
                      s.setUserAgentString(DESKTOP);
                      s.setUseWideViewPort(true);
                      s.setLoadWithOverviewMode(true);
                      webView.setInitialScale(75);
                  } else {
                      s.setUserAgentString(MOBILE);
                      s.setUseWideViewPort(false);
                      s.setLoadWithOverviewMode(false);
                      webView.setInitialScale(0);
                  }
              }

              private Button makeBtn(String t) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setTextColor(Color.parseColor("#F5EADB"));
                  b.setTextSize(12);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.parseColor("#3B2C1E"));
                  g.setCornerRadius(18);
                  g.setStroke(2, Color.parseColor("#9E7D47"));
                  b.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 115, 1f);
                  lp.setMargins(6, 0, 6, 0);
                  b.setLayoutParams(lp);
                  return b;
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          ENDSCRIPT
          bash run.sh
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-App-Official
          path: app/build/outputs/apk/debug/*.apk
          
